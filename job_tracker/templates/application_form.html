{% extends "base.html" %}{% block title %}{{ title }} · JobMatch{% endblock %}{% block content %}
<section class="narrow"><div class="page-heading"><div><a class="back-link" href="{{ url_for('main.applications') }}">← Applications</a><h1>{{ title }}</h1><p>Keep the details useful for your next follow-up.</p></div></div>
<form class="panel form-card" method="post"><div class="form-grid"><label>Company <span>*</span><input name="company" value="{{ application.company|default('') }}" required autofocus></label><label>Role <span>*</span><input name="role" value="{{ application.role|default('') }}" required></label></div>
<div class="form-grid"><label>Status <span>*</span><select name="status">{% for status in statuses %}<option {{ 'selected' if application.status==status }}>{{ status }}</option>{% endfor %}</select></label><label>Date applied <span>*</span><input type="date" name="date_applied" value="{{ application.date_applied }}" required></label></div>
<label>Job link<input type="url" name="job_link" value="{{ application.job_link|default('') }}" placeholder="https://company.com/jobs/..."></label><label>Notes<textarea name="notes" rows="6" placeholder="Referral, recruiter, interview notes, next steps...">{{ application.notes|default('') }}</textarea></label>
<div class="form-actions"><a class="button button-secondary" href="{{ url_for('main.applications') }}">Cancel</a><button class="button">Save application</button></div></form></section>{% endblock %}
